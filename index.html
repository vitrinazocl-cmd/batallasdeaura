<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batallas de Aura - Sitio en Mantención</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #05070f;
      background-image: radial-gradient(circle at center, #0d1528 0%, #05070f 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 20px;
      overflow: hidden;
    }

    .maintenance-container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .maintenance-image {
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 16px;
      border: 2px solid rgba(0, 243, 255, 0.45);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.25), 0 0 60px rgba(255, 0, 122, 0.15);
    }
  </style>
</head>
<body>
  <main class="maintenance-container">
    <img src="mantencion.jpg" alt="Batallas de Aura - Sitio en Mantención" class="maintenance-image">
  </main>
</body>
</html>
